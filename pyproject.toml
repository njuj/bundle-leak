[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundle-leak"
dynamic = ["version"]
description = "Find what a web app ships to every visitor that it shouldn't: secret keys in JS bundles, public env vars with secret names, exposed source maps, internal hosts. Live sites or build folders. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "kira", email = "286490266+njuj@users.noreply.github.com" }]
keywords = ["secrets", "secret-scanning", "javascript", "source-maps", "supabase", "nextjs", "vite", "appsec", "devsecops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/njuj/bundle-leak"

[project.scripts]
bundle-leak = "bundleleak.cli:main"

[tool.setuptools.dynamic]
version = { attr = "bundleleak.__version__" }

[tool.setuptools.packages.find]
include = ["bundleleak*"]
